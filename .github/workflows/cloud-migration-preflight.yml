name: Cloud Migration Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - 'public/_worker.js'
      - 'docs/cloud-migration-cloudflare-pages.md'
      - '.github/workflows/cloud-migration-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install DNS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Snapshot public DNS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud-preflight
          {
            echo '# DNS snapshot'
            date -u
            for host in devina.id www.devina.id archive.devina.id music.devina.id hq.devina.id ols.devina.id kersaa.devina.id ploos.devina.id ciyus.devina.id pulse.devina.id; do
              echo
              echo "## $host"
              for type in A AAAA CNAME; do
                echo "-- $type"
                dig +short "$host" "$type" || true
              done
            done
            echo
            echo '## apex NS'
            dig +short devina.id NS || true
            echo
            echo '## apex MX'
            dig +short devina.id MX || true
            echo
            echo '## apex TXT'
            dig +short devina.id TXT || true
          } | tee cloud-preflight/dns-snapshot.txt

      - name: Snapshot live HTTP status
        shell: bash
        run: |
          set -euo pipefail
          {
            for url in https://devina.id/ https://devina.id/about/ https://devina.id/achievements/ https://devina.id/research-writing/ https://devina.id/journal/ https://archive.devina.id/ https://music.devina.id/ https://hq.devina.id/; do
              echo
              echo "## $url"
              curl --silent --show-error --location --max-time 30 --output /dev/null --write-out 'final_url=%{url_effective}\nstatus=%{http_code}\nremote_ip=%{remote_ip}\n' "$url" || true
            done
          } | tee cloud-preflight/http-snapshot.txt

      - name: Check known apex verification surfaces
        shell: bash
        run: |
          set -euo pipefail
          {
            for path in /BingSiteAuth.xml /ads.txt /.well-known/; do
              echo
              echo "## $path"
              curl --silent --show-error --location --max-time 20 --output /dev/null --write-out 'status=%{http_code}\nfinal_url=%{url_effective}\n' "https://devina.id$path" || true
            done
          } | tee cloud-preflight/verification-snapshot.txt

      - name: Preserve currently public verification files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://devina.id/BingSiteAuth.xml -o cloud-preflight/BingSiteAuth.xml
          curl --fail --silent --show-error --location --max-time 20 https://devina.id/ads.txt -o cloud-preflight/ads.txt

      - name: Validate Cloudflare Pages worker syntax
        run: node --check public/_worker.js

      - name: Upload migration snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cloud-migration-preflight
          path: cloud-preflight/
          retention-days: 30
