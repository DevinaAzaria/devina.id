name: devina.id Website Build

# CI only. Production deployment is handled by production-deploy.yml
# after site-affecting changes land on main.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/achievements/index.html
          test -f dist/research-writing/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/favicon.svg
          test -f dist/favicon.png
          test -f dist/_worker.js
          node --check dist/_worker.js
          test -d dist/journal
          grep -q 'https://devina.id/research-writing/' dist/sitemap.xml
          grep -q 'https://devina.id/journal/ai-governance-debt/' dist/sitemap.xml
          grep -q 'https://devina.id/journal/belajar-jamu-dari-titi-ratu/' dist/sitemap.xml
          grep -q 'data-seo-writing="true"' dist/journal/ai-governance-debt/index.html
          grep -q '"@type":"Article"' dist/journal/ai-governance-debt/index.html
          grep -q '"@type":"BreadcrumbList"' dist/journal/ai-governance-debt/index.html

      - name: Upload devina.id build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devina.id-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
