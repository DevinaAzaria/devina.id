name: Deploy devina.id Production

# Architecture:
# - Pull requests are validated by website-build.yml.
# - Every site-affecting push to main is built, verified, and deployed here.
# - workflow_dispatch remains available for a manual redeploy without a code change.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'content/schedules/**'
      - 'astro.config.mjs'
      - '.github/workflows/production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: devina-id-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/achievements/index.html
          test -f dist/research-writing/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/.htaccess
          test -f dist/favicon.svg
          test -f dist/favicon.png
          test -d dist/journal
          grep -q 'https://devina.id/journal/ai-governance-debt/' dist/sitemap.xml
          grep -q 'https://devina.id/journal/belajar-jamu-dari-titi-ratu/' dist/sitemap.xml
          grep -q 'https://devina.id/research-writing/' dist/sitemap.xml
          grep -q 'data-seo-writing="true"' dist/journal/ai-governance-debt/index.html
          grep -q '"@type":"Article"' dist/journal/ai-governance-debt/index.html
          grep -q '"@type":"BreadcrumbList"' dist/journal/ai-governance-debt/index.html
          grep -q 'Curious by nature' dist/index.html
          grep -q 'application/ld+json' dist/index.html
          grep -q 'ProfilePage' dist/about/index.html
          grep -q 'Some milestones along the way.' dist/achievements/index.html

      - name: Install encrypted FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify archive safety copy
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://archive.devina.id/ > /tmp/devina-archive.html
          test -s /tmp/devina-archive.html

      - name: Deploy static build over FTPS
        env:
          FTP_SERVER: ${{ secrets.DEVINA_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.DEVINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.DEVINA_FTP_PASSWORD }}
          FTP_PORT: ${{ vars.DEVINA_FTP_PORT || '21' }}
        run: |
          server="${FTP_SERVER#ftp://}"
          server="${server#ftps://}"
          server="${server%/}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$server" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --delete --parallel=4 \
            --exclude-glob .well-known/** \
            --exclude-glob google*.html \
            --exclude-glob BingSiteAuth.xml \
            --exclude-glob ads.txt \
            ./dist/ /devina.id/public_html/
          bye
          LFTP

      - name: Verify production
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://devina.id/ > /tmp/devina-home.html
          grep -q 'Curious by nature' /tmp/devina-home.html
          curl --fail --silent --show-error --location --max-time 30 https://devina.id/about/ > /tmp/devina-about.html
          grep -q 'ProfilePage' /tmp/devina-about.html
          curl --fail --silent --show-error --location --max-time 30 https://devina.id/achievements/ > /tmp/devina-achievements.html
          grep -q 'Some milestones along the way.' /tmp/devina-achievements.html
          curl --fail --silent --show-error --location --max-time 30 https://devina.id/research-writing/ > /tmp/devina-research-writing.html
          grep -q 'Research &amp; Writing' /tmp/devina-research-writing.html
          curl --fail --silent --show-error --location --max-time 30 https://devina.id/journal/ai-governance-debt/ > /tmp/devina-ai-essay.html
          grep -q 'data-seo-writing="true"' /tmp/devina-ai-essay.html
          grep -q '"@type":"Article"' /tmp/devina-ai-essay.html
          curl --fail --silent --show-error --location --max-time 30 https://devina.id/favicon.png > /dev/null
          curl --fail --silent --show-error --location --max-time 30 https://devina.id/robots.txt > /dev/null
          curl --fail --silent --show-error --location --max-time 30 https://devina.id/sitemap.xml > /dev/null
          curl --fail --silent --show-error --location --max-time 30 https://archive.devina.id/ > /dev/null
