name: Mirror devina.id Legacy Fallback

# Architecture:
# - Cloudflare Pages is the production host for devina.id.
# - This workflow temporarily mirrors the same static build to the old FTPS origin
#   so DNS can be rolled back during the migration window.
# - Remove or disable this workflow after one stable publishing cycle.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'content/schedules/**'
      - 'content/publications/**'
      - 'astro.config.mjs'
      - '.github/workflows/production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: devina-id-legacy-fallback
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Prepare legacy Apache fallback
        run: cp public/.htaccess dist/.htaccess

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/achievements/index.html
          test -f dist/research-writing/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/.htaccess
          test -f dist/favicon.svg
          test -f dist/favicon.png
          test -d dist/journal
          grep -q 'https://devina.id/journal/ai-governance-debt/' dist/sitemap.xml
          grep -q 'https://devina.id/journal/belajar-jamu-dari-titi-ratu/' dist/sitemap.xml
          grep -q 'https://devina.id/research-writing/' dist/sitemap.xml
          grep -q 'data-seo-writing="true"' dist/journal/ai-governance-debt/index.html
          grep -q '"@type":"Article"' dist/journal/ai-governance-debt/index.html
          grep -q '"@type":"BreadcrumbList"' dist/journal/ai-governance-debt/index.html
          grep -q 'Curious by nature' dist/index.html
          grep -q 'application/ld+json' dist/index.html
          grep -q 'ProfilePage' dist/about/index.html
          grep -q 'Some milestones along the way.' dist/achievements/index.html

      - name: Install encrypted FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify archive safety copy
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://archive.devina.id/ > /tmp/devina-archive.html
          test -s /tmp/devina-archive.html

      - name: Deploy static build over FTPS
        env:
          FTP_SERVER: ${{ secrets.DEVINA_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.DEVINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.DEVINA_FTP_PASSWORD }}
          FTP_PORT: ${{ vars.DEVINA_FTP_PORT || '21' }}
        run: |
          server="${FTP_SERVER#ftp://}"
          server="${server#ftps://}"
          server="${server%/}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$server" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --delete --parallel=4 \
            --exclude-glob .well-known/** \
            --exclude-glob google*.html \
            --exclude-glob BingSiteAuth.xml \
            --exclude-glob ads.txt \
            --exclude-glob _worker.js \
            ./dist/ /devina.id/public_html/
          bye
          LFTP

      - name: Verify legacy fallback origin
        run: |
          # Verify the old origin directly even though public DNS now points to Cloudflare Pages.
          ORIGIN_IP="162.244.93.4"
          curl --fail --silent --show-error --location --max-time 30 --resolve "devina.id:443:$ORIGIN_IP" https://devina.id/ > /tmp/devina-home.html
          grep -q 'Curious by nature' /tmp/devina-home.html
          curl --fail --silent --show-error --location --max-time 30 --resolve "devina.id:443:$ORIGIN_IP" https://devina.id/about/ > /tmp/devina-about.html
          grep -q 'ProfilePage' /tmp/devina-about.html
          curl --fail --silent --show-error --location --max-time 30 --resolve "devina.id:443:$ORIGIN_IP" https://devina.id/research-writing/ > /tmp/devina-research-writing.html
          grep -q 'Research &amp; Writing' /tmp/devina-research-writing.html
          curl --fail --silent --show-error --location --max-time 30 --resolve "devina.id:443:$ORIGIN_IP" https://devina.id/research-writing/articles-explainers/akun-penting-programmer/ > /tmp/devina-programmer-article.html
          grep -q 'Akun Penting untuk Programmer' /tmp/devina-programmer-article.html
          curl --fail --silent --show-error --location --max-time 30 https://archive.devina.id/ > /dev/null
